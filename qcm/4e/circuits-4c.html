<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="20 questions illustrées sur les circuits électriques pour les 4C SEGPA.">
  <title>QCM 4C SEGPA - Circuits électriques</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/quiz-4c-circuits.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <strong>Collège NDC — Sciences Physiques</strong>
      <a href="index.html">← Retour aux QCM de 4e</a>
    </div>
  </div>
  <main class="page">
    <div class="page-title">
      <span class="section-kicker">4C SEGPA • QCM</span>
      <h1>Circuits électriques</h1>
      <p>Rappels de 5e : 20 questions sur les circuits en série et en dérivation.</p>
      <p>Observe l’image et lis la question. Choisis une seule réponse, puis lis l’explication.</p>
    </div>
    <section class="quiz-card" id="quiz" aria-label="Questionnaire">
      <div class="quiz-progress" id="progress"></div>
      <div class="section-kicker" id="category"></div>
      <h2 class="question-title" id="question" tabindex="-1"></h2>
      <div id="illustrations" class="quiz-illustrations" hidden></div>
      <div class="answers" id="answers" role="group" aria-labelledby="question"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="quiz-actions">
        <button class="btn btn-secondary" id="nextBtn" style="display:none;">Question suivante</button>
      </div>
    </section>
    <noscript><p>Active JavaScript dans ton navigateur pour répondre au QCM.</p></noscript>
  </main>
  <script src="../../js/quiz-4c-circuits.js"></script>
</body>
</html>
