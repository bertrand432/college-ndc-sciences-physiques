<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="20 questions pour les 3D SEGPA : transformations chimiques, particules et états de la matière.">
  <title>QCM 3D SEGPA - Transformations chimiques et matière</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/quiz-3d-securite.css">
  <link rel="stylesheet" href="../../css/quiz-3d-chimie.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <strong>Collège NDC — Sciences Physiques</strong>
      <a href="index.html">← Retour aux QCM de 3e</a>
    </div>
  </div>
  <main class="page">
    <div class="page-title">
      <span class="section-kicker">3D SEGPA • QCM</span>
      <h1>Transformations chimiques et matière</h1>
      <p>20 questions sur les combustions, les particules et les états de la matière.</p>
      <p>Choisis une seule réponse, puis lis l’explication.</p>
    </div>
    <section class="quiz-card" id="quiz" aria-label="Questionnaire">
      <div class="quiz-progress" id="progress"></div>
      <div class="section-kicker" id="category"></div>
      <h2 class="question-title" id="question" tabindex="-1"></h2>
      <div id="courseVisual" hidden><p class="image-help">Fais défiler l’image horizontalement pour lire le tableau.</p><div class="image-scroll" tabindex="0" role="region" aria-label="Extrait du cours"><img id="pictogramme" class="quiz-pictogramme" alt="" hidden></div></div>
      <div class="answers" id="answers" role="group" aria-labelledby="question"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="quiz-actions">
        <button class="btn btn-secondary" id="nextBtn" style="display:none;">Question suivante</button>
      </div>
    </section>
    <noscript><p>Active JavaScript dans ton navigateur pour répondre au QCM.</p></noscript>
  </main>
  <script src="../../js/quiz-3d-chimie.js"></script>
